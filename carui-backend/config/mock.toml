
listen_addr = "0.0.0.0:9090"


[gpio]
chip = "gpiochip0"

door_pins = [17, 27, 22, 23]

reverse_pin = 24

[parking]

[[parking.sensors]]
position = "rear_left"
uart_index = 0

[[parking.sensors]]
position = "rear_center_left"
uart_index = 1

[[parking.sensors]]
position = "rear_center_right"
uart_index = 2

[[parking.sensors]]
position = "rear_right"
uart_index = 3

[[parking.sensors]]
position = "front_left"
uart_index = 4

[[parking.sensors]]
position = "front_center_left"
uart_index = 5

[[parking.sensors]]
position = "front_center_right"
uart_index = 6

[[parking.sensors]]
position = "front_right"
uart_index = 7

[[parking.sensors]]
position = "left_front"
uart_index = 8

[[parking.sensors]]
position = "left_rear"
uart_index = 9

[[parking.sensors]]
position = "right_front"
uart_index = 10

[[parking.sensors]]
position = "right_rear"
uart_index = 11

[[v4l2_devices]]
camera_id = "front"
device = "/dev/video10"

[[v4l2_devices]]
camera_id = "rear"
device = "/dev/video11"

[[v4l2_devices]]
camera_id = "left"
device = "/dev/video12"

[[v4l2_devices]]
camera_id = "right"
device = "/dev/video13"
